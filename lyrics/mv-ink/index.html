<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生幸事 · 水墨 MV</title>
<style>
  @font-face { font-family: "MSZ"; src: url("fonts/MaShanZheng-subset.ttf") format("truetype"); }
  html, body { margin: 0; height: 100%; background: #171411; color: #e9dfcc; font-family: "Noto Serif SC", "Songti SC", serif; }
  #stage { position: fixed; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: auto; height: auto; max-height: 100%; max-width: 100%; aspect-ratio: 9 / 16; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 10px; align-items: center; padding: 0 12px; background: #211c18; box-sizing: border-box; }
  #bar button, #bar select { background: #2f2822; color: #eadfca; border: 1px solid #54473c; border-radius: 4px; padding: 8px 12px; font-size: 15px; white-space: nowrap; flex: none; }
  #bar select { max-width: 32vw; }
  #bar input[type=range] { flex: 1; min-width: 0; width: 0; accent-color: #b8322a; }
  #time { font-variant-numeric: tabular-nums; min-width: 64px; font-size: 14px; color: #c9bba4; flex: none; }
  body.export #bar { display: none; } body.export #stage { inset: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="bar">
  <button id="play">播放</button>
  <span id="time">0:00.0</span>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <select id="scene"></select>
</div>
<audio id="audio" src="../mv/audio.mp3" preload="auto"></audio>
<script src="../mv/timeline.js"></script>
<script>
"use strict";
// 《人生幸事》水墨版：冷灰宣纸、横向淡墨云带、淡花青远山、浓墨山脊、墨晕山石、地平线与草，
// 竖排书法歌词。整首歌像一卷山水长卷缓缓向左展开。每帧由 renderAt(t) 确定性绘制。
const TL = window.TIMELINE, W = 1080, H = 1920;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let g = ctx;
const CAL = '"MSZ", "Ma Shan Zheng", "STKaiti", "KaiTi", serif';
const LINES = TL.lines.filter(l => l.text).map(l => {
  const next = TL.lines.find(x => x.t > l.t);
  return { ...l, end: next ? next.t : TL.duration };
});

// ---------- 工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const easeOut = x => Math.sin(Math.PI / 2 * clamp(x));
const lerp = (a, b, t) => a + (b - a) * t;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, seed, P = 0) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = P ? ((i % P) + P) % P : i, b = P ? (((i + 1) % P) + P) % P : i + 1;
  return lerp(hash(a + seed * 101.3), hash(b + seed * 101.3), u);
}
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const INK = [34, 34, 34], BLUE = [104, 120, 140], PAPER = [236, 234, 228];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function lastBefore(arr, t) { let lo = 0, hi = arr.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; }
function sectionIndex(t) { let i = 0; TL.sections.forEach((s, k) => { if (s.t <= t) i = k; }); return i; }
function withCanvas(c, fn) { const old = g; g = c.getContext("2d"); fn(g); g = old; return c; }

// ---------- 毛笔笔触 ----------
function resample(pts, step = 4) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < n; k++) {
      const s = k / n, s2 = s * s, s3 = s2 * s;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * s + (2 * a - 5 * b + 4 * c - d) * s2 + (-a + 3 * b - 3 * c + d) * s3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function brush(pts, o = {}) {
  const w = o.w || 10, ink = o.ink || INK, a = o.a ?? 0.85, dry = o.dry ?? 0.3, seed = o.seed || 1;
  const strands = o.strands || Math.max(3, Math.min(16, Math.round(w / 3))), taper = o.taper || "both";
  const S = resample(pts, o.step || 4), F = S.length;
  const wid = u => taper === "both" ? w * (0.18 + 0.82 * Math.pow(Math.sin(Math.PI * clamp(u)), 0.6))
    : taper === "start" ? w * Math.min(1, 0.35 + u * 6) * (1 - 0.82 * Math.pow(u, 1.5)) : w;
  const E = S.map((p, i) => {
    const q0 = S[Math.max(0, i - 1)], q1 = S[Math.min(F - 1, i + 1)];
    const dx = q1[0] - q0[0], dy = q1[1] - q0[1], d = Math.hypot(dx, dy) || 1, u = i / (F - 1);
    return { x: p[0], y: p[1], nx: -dy / d, ny: dx / d, hw: wid(u) * (0.85 + 0.3 * vnoise(u * 6, seed)) / 2, u };
  });
  g.fillStyle = rgba(ink, a * 0.5 * (1 - dry * 0.6));
  g.beginPath();
  E.forEach((e, i) => i ? g.lineTo(e.x + e.nx * e.hw, e.y + e.ny * e.hw) : g.moveTo(e.x + e.nx * e.hw, e.y + e.ny * e.hw));
  for (let i = F - 1; i >= 0; i--) g.lineTo(E[i].x - E[i].nx * E[i].hw, E[i].y - E[i].ny * E[i].hw);
  g.fill();
  g.strokeStyle = rgba(ink, a * 0.55); g.lineCap = "round"; g.lineJoin = "round";
  for (let k = 0; k < strands; k++) {
    const off = strands === 1 ? 0 : (k / (strands - 1) - 0.5) * 1.8;
    g.lineWidth = Math.max(0.8, w / strands * 1.25 * (0.6 + 0.8 * hash(seed + k)));
    g.beginPath(); let pen = false;
    for (const e of E) {
      if (vnoise(e.u * (9 + (k % 5) * 4) + k * 13.1, seed + k) < dry * (0.2 + e.u * 1.1) * (Math.abs(off) * 0.7 + 0.5)) { pen = false; continue; }
      const x = e.x + e.nx * e.hw * off, y = e.y + e.ny * e.hw * off;
      if (pen) g.lineTo(x, y); else { g.moveTo(x, y); pen = true; }
    }
    g.stroke();
  }
}
function blob(x, cx, cy, rx, ry, seed, flatTop = 0.85, n = 40) {   // 不规则的墨块轮廓
  x.beginPath();
  for (let i = 0; i <= n; i++) {
    const an = i / n * 6.283, r = 0.78 + 0.32 * vnoise(i * 0.38, seed, Math.round(n * 0.38)) + 0.07 * vnoise(i * 1.9, seed + 3);
    let px = cx + Math.cos(an) * rx * r, py = cy + Math.sin(an) * ry * r;
    if (py < cy) py = cy - (cy - py) * flatTop;
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  }
  x.closePath();
}

// ---------- 长卷素材（预渲染） ----------
const PAN = 24;                                         // 近景每秒左移的像素
const WORLD = Math.ceil(W + TL.duration * PAN + 400);
const PAPER_C = withCanvas(mk(W, H), x => {             // 冷灰生宣
  x.fillStyle = rgba(PAPER, 1); x.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) {
    const gx = hash(i * 3.1) * W, gy = hash(i * 7.7) * H, r = 260 + hash(i * 1.3) * 520;
    const gr = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    gr.addColorStop(0, `rgba(205,203,196,${0.06 + hash(i) * 0.07})`); gr.addColorStop(1, "rgba(205,203,196,0)");
    x.fillStyle = gr; x.fillRect(0, 0, W, H);
  }
  const id = x.getImageData(0, 0, W, H), d = id.data; let s = 12345;
  for (let i = 0; i < d.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = (((s >> 8) & 255) / 255 - 0.5) * 11; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  x.putImageData(id, 0, 0);
  x.lineCap = "round";
  for (let i = 0; i < 700; i++) {
    const fx = hash(i * 1.7 + 0.3) * W, fy = hash(i * 2.9 + 0.1) * H, l = 8 + hash(i * 5.3) * 30, an = hash(i * 9.1) * 6.28;
    x.strokeStyle = hash(i * 4.4) > 0.5 ? "rgba(255,255,252,0.35)" : "rgba(120,120,115,0.08)";
    x.lineWidth = 0.6 + hash(i * 3.3);
    x.beginPath(); x.moveTo(fx, fy); x.lineTo(fx + Math.cos(an) * l, fy + Math.sin(an) * l); x.stroke();
  }
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
  v.addColorStop(0, "rgba(90,90,85,0)"); v.addColorStop(1, "rgba(90,90,85,0.14)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
});
const MIST_RAW = withCanvas(mk(2400, H), () => {             // 横向的淡墨云带，可左右平铺
  for (let i = 0; i < 24; i++) {
    const y = 240 + hash(i * 2.3) * 1360, len = 300 + hash(i * 4.1) * 1000, x0 = hash(i * 7.9) * 2400;
    for (const dx of [0, -2400]) {
      const xs = x0 + dx;
      brush([[xs, y], [xs + len * 0.35, y + (hash(i) - 0.5) * 5], [xs + len * 0.7, y - (hash(i * 3) - 0.5) * 5], [xs + len, y]],
        { w: 5 + hash(i * 5.5) * 12, a: 0.1 + hash(i * 6.6) * 0.12, dry: 0.8, seed: 300 + i, strands: 4, step: 10 });
    }
  }
});
const MIST = withCanvas(mk(2400, H), x => { x.filter = "blur(1.5px)"; x.drawImage(MIST_RAW, 0, 0); });
function makeHills(w, h, seed, ink, alpha, edgeA) {      // 远山：圆缓的淡花青山包，山顶一道稍深的轮廓
  const lo = mk(w / 4, h / 4), lx = lo.getContext("2d"); lx.scale(0.25, 0.25);
  const ridge = [];
  for (let x = 0; x <= w; x += 8) {
    const n = vnoise(x / 600, seed, 4) * 0.7 + vnoise(x / 200, seed + 3, 12) * 0.22 + vnoise(x / 60, seed + 7, 40) * 0.08;
    ridge.push([x, h * 0.15 + h * 0.65 * (1 - Math.pow(n, 1.4))]);
  }
  const gr = lx.createLinearGradient(0, h * 0.15, 0, h);
  gr.addColorStop(0, rgba(ink, alpha)); gr.addColorStop(0.45, rgba(ink, alpha * 0.4)); gr.addColorStop(1, rgba(ink, 0));
  lx.fillStyle = gr; lx.beginPath(); lx.moveTo(0, h); ridge.forEach(([x, y]) => lx.lineTo(x, y)); lx.lineTo(w, h); lx.fill();
  return withCanvas(mk(w, h), x => {
    x.imageSmoothingQuality = "high"; x.drawImage(lo, 0, 0, w, h);
    brush(ridge.filter((_, i) => i % 4 === 0), { w: 6, ink, a: edgeA, dry: 0.65, seed, taper: "none", strands: 3, step: 8 });
    x.save(); x.beginPath(); x.moveTo(0, h); ridge.forEach(([px, py]) => x.lineTo(px, py)); x.lineTo(w, h); x.clip();
    for (let i = 0; i < 500; i++) { x.fillStyle = rgba(ink, 0.05 + hash(i * 1.3) * 0.08); x.fillRect(hash(i * 2.7) * w, h * 0.15 + hash(i * 3.9) * h * 0.5, 1.5, 1.5); }
    x.restore();
  });
}
const HILLS = [makeHills(2400, 520, 4, BLUE, 0.2, 0.3), makeHills(2400, 560, 12, [88, 98, 112], 0.26, 0.35)];
function makeRidge(seed, w, h) {                         // 浓墨山脊：一道粗重的坡线，往下渐淡
  const top = []; for (let i = 0; i <= 10; i++) { const u = i / 10; top.push([u * w, h * (0.12 + 0.6 * Math.pow(u, 1.3)) + (vnoise(u * 8, seed) - 0.5) * 30]); }
  return withCanvas(mk(w, h), x => {
    x.save(); x.filter = "blur(5px)"; x.beginPath(); x.moveTo(0, h); top.forEach(p => x.lineTo(...p)); x.lineTo(w, h); x.closePath();
    const gr = x.createLinearGradient(0, h * 0.1, 0, h); gr.addColorStop(0, rgba(INK, 0.22)); gr.addColorStop(0.6, rgba(INK, 0.05)); gr.addColorStop(1, rgba(INK, 0));
    x.fillStyle = gr; x.fill(); x.restore();
    brush(top, { w: 30, a: 0.9, dry: 0.55, seed, taper: "start", strands: 10 });
    brush(top.map(([px, py]) => [px, py + 16]), { w: 12, a: 0.4, dry: 0.7, seed: seed + 1, taper: "start", strands: 4 });
    x.globalCompositeOperation = "destination-in";        // 左右两端都淡出，不留素材边
    const fx = x.createLinearGradient(0, 0, w, 0);
    fx.addColorStop(0, "rgba(0,0,0,0)"); fx.addColorStop(0.22, "rgba(0,0,0,1)"); fx.addColorStop(0.65, "rgba(0,0,0,1)"); fx.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = fx; x.fillRect(0, 0, w, h);
    x.globalCompositeOperation = "source-over";
  });
}
function makeRock(seed, w, h) {                          // 墨晕山石：几层淡墨叠染，湿边略深，内里几笔竖皴
  return withCanvas(mk(w, h), x => {
    const cx = w / 2, cy = h * 0.55, rx = w * 0.4, ry = h * 0.34;
    x.save(); x.filter = "blur(3px)"; blob(x, cx, cy, rx * 0.98, ry * 0.98, seed); x.fillStyle = rgba(PAPER, 0.9); x.fill(); x.restore();   // 先铺纸色，挡住后面的远山线
    x.save(); x.filter = "blur(7px)"; blob(x, cx, cy, rx, ry, seed); x.fillStyle = rgba(INK, 0.3); x.fill(); x.restore();
    x.save(); x.filter = "blur(2.5px)"; blob(x, cx, cy, rx, ry, seed); x.strokeStyle = rgba(INK, 0.2); x.lineWidth = 7; x.stroke(); x.restore();
    x.save(); blob(x, cx, cy, rx * 0.97, ry * 0.97, seed); x.clip();
    for (let k = 0; k < 8; k++) {
      x.save(); x.filter = `blur(${8 + hash(seed + k) * 8}px)`;
      blob(x, cx + (hash(seed + k * 3) - 0.5) * rx * 1.4, cy + (hash(seed + k * 5) - 0.5) * ry * 1.2, rx * (0.2 + hash(seed + k) * 0.3), ry * (0.25 + hash(seed + k * 7) * 0.35), seed + k * 11, 1, 24);
      x.fillStyle = rgba(INK, 0.07 + hash(seed + k * 9) * 0.16); x.fill(); x.restore();
    }
    const tg = x.createLinearGradient(0, cy - ry, 0, cy + ry); tg.addColorStop(0, rgba(INK, 0.14)); tg.addColorStop(1, rgba(INK, 0));
    x.fillStyle = tg; x.fillRect(0, 0, w, h);
    for (let k = 0; k < 9; k++) {
      const sx = cx + (hash(seed + k * 13) - 0.5) * rx * 1.5, sy = cy - ry * (0.5 + hash(seed + k) * 0.4), L = ry * (0.7 + hash(seed + k * 17) * 0.9);
      brush([[sx, sy], [sx + (hash(seed + k * 2) - 0.5) * 14, sy + L * 0.5], [sx + (hash(seed + k * 4) - 0.5) * 22, sy + L]],
        { w: 3 + hash(seed + k * 19) * 4, a: 0.55, dry: 0.55, seed: seed + 40 + k, taper: "start", strands: 2 });
    }
    for (let k = 0; k < 3; k++) {
      const sx = cx + (hash(seed + k * 23) - 0.6) * rx, sy = cy - ry * 0.6;
      brush([[sx - 50, sy + 40], [sx, sy - 10], [sx + 40, sy + 30], [sx + 70, sy + 10]], { w: 4, a: 0.45, dry: 0.6, seed: seed + 70 + k, strands: 2 });
    }
    for (let i = 0; i < 900; i++) { x.fillStyle = rgba(INK, 0.04 + hash(seed + i * 1.1) * 0.08); x.fillRect(hash(seed + i * 2.3) * w, hash(seed + i * 3.7) * h, 1.6, 1.6); }
    x.restore();
  });
}
const ROCKS = [makeRock(5, 900, 520), makeRock(17, 700, 460), makeRock(29, 560, 380), makeRock(41, 1000, 560)];
const RIDGES = [makeRidge(61, 900, 420), makeRidge(73, 760, 360)];
const GROUND_Y = 1740;
const GROUND = withCanvas(mk(WORLD, 480), () => {        // 地平线：一道墨线，苔点，几簇草
  const line = []; for (let x = -20; x <= WORLD + 20; x += 160) line.push([x, 220 + (vnoise(x / 500, 81) - 0.5) * 18]);
  brush(line, { w: 20, a: 0.8, dry: 0.5, seed: 82, taper: "none", strands: 5, step: 8 });
  brush(line.map(([x, y]) => [x, y + 26]), { w: 22, a: 0.18, dry: 0.75, seed: 83, taper: "none", strands: 5, step: 8 });
  brush(line.map(([x, y]) => [x, y + 120]), { w: 10, a: 0.12, dry: 0.8, seed: 84, taper: "none", strands: 3, step: 10 });
  const yAt = x => 220 + (vnoise(x / 500, 81) - 0.5) * 18;
  for (let i = 0; i < WORLD / 26; i++) {
    const x = hash(i * 3.3) * WORLD; const gx = g;
    gx.fillStyle = rgba(INK, 0.5 + hash(i) * 0.4); gx.beginPath(); gx.ellipse(x, yAt(x) + (hash(i * 5) - 0.5) * 10, 2 + hash(i * 7) * 4, 1.5 + hash(i * 9) * 2.5, 0, 0, 6.283); gx.fill();
  }
  let x = 60;
  while (x < WORLD) {
    const n = 3 + Math.floor(hash(x) * 5), y = yAt(x);
    for (let k = 0; k < n; k++) {
      const bx = x + k * 13 + hash(x + k) * 10, hgt = 100 + hash(x * 1.3 + k) * 90, lean = (hash(x * 2.1 + k) - 0.35) * 80;
      brush([[bx, y + 4], [bx + lean * 0.3, y - hgt * 0.55], [bx + lean, y - hgt]], { w: 7, a: 0.75, dry: 0.35, seed: x + k, taper: "start", strands: 3 });
    }
    x += 200 + hash(x * 0.7) * 280;
  }
});
// 长卷上的物件：[素材, 世界坐标 x, 底边 y, 缩放, 视差]
const PROPS = [];
for (let i = 0, x = 300; x < WORLD * 0.95; i++) {
  PROPS.push({ img: RIDGES[i % 2], x: x * 0.62, y: 1240, s: 0.9 + hash(i * 3) * 0.4, p: 0.62, flip: i % 2 === 1 });
  x += 1900 + hash(i * 5) * 900;
}
for (let i = 0, x = 650; x < WORLD; i++) {
  PROPS.push({ img: ROCKS[i % 4], x: x * 0.82, y: 1620 - hash(i * 7) * 90, s: 0.75 + hash(i * 2) * 0.45, p: 0.82 });
  x += 900 + hash(i * 11) * 600;
}
function tile(img, dx, y, a = 1) {
  const w = img.width, x0 = -(((dx % w) + w) % w);
  g.globalAlpha = a; g.drawImage(img, x0, y); if (x0 + w < W) g.drawImage(img, x0 + w, y); g.globalAlpha = 1;
}
function scenery(t) {
  const cam = t * PAN;
  g.drawImage(PAPER_C, 0, 0);
  tile(HILLS[0], cam * 0.22 + 300, 760);
  tile(MIST, cam * 0.3 + t * 5, 0, 0.9);
  tile(HILLS[1], cam * 0.38 + 1100, 900);
  for (const p of PROPS) {
    if (p.p > 0.7) continue;
    const w = p.img.width * p.s, h = p.img.height * p.s, x = p.x - cam * p.p;
    if (x > W || x + w < 0) continue;
    g.save(); g.translate(x + (p.flip ? w : 0), p.y - h); g.scale(p.flip ? -p.s : p.s, p.s); g.drawImage(p.img, 0, 0); g.restore();
  }
  tile(MIST, cam * 0.55 + 900 + t * 3, 260, 0.55);
  for (const p of PROPS) {
    if (p.p <= 0.7) continue;
    const w = p.img.width * p.s, h = p.img.height * p.s, x = p.x - cam * p.p;
    if (x > W || x + w < 0) continue;
    g.drawImage(p.img, x, p.y - h, w, h);
  }
  g.drawImage(GROUND, cam, 0, W, 480, 0, GROUND_Y - 220, W, 480);
}

// ---------- 竖排书法歌词 ----------
const GLY = new Map();
function glyph(ch, size) {
  const key = ch + size;
  if (GLY.has(key)) return GLY.get(key);
  const pad = Math.round(size * 0.45), s = size + pad * 2, c = mk(s, s), x = c.getContext("2d");
  x.font = `${size}px ${CAL}`; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = rgba(INK, 1); x.fillText(ch, s / 2, s / 2 + size * 0.04);
  const h = mk(s, s), hx = h.getContext("2d"); hx.filter = `blur(${Math.round(size * 0.08)}px)`; hx.drawImage(c, 0, 0);
  const o = { c, h, s }; GLY.set(key, o); return o;
}
function drawGlyph(ch, x, y, size, p, fade) {           // 落笔：墨稍稍洇开再收住
  if (p <= 0 || fade <= 0) return;
  const G = glyph(ch, Math.round(size)), e = easeOut(p);
  const hs = G.s * (0.95 + 0.2 * e);
  g.globalAlpha = fade * 0.35 * (1 - e); g.drawImage(G.h, x - hs / 2, y - hs / 2, hs, hs);
  g.globalAlpha = fade * clamp(p * 1.5); g.drawImage(G.c, x - G.s / 2, y - G.s / 2, G.s, G.s);
  g.globalAlpha = 1;
}
const COLW = 96, SZ = 74, GAP = 26, XR = 560;
const cols = l => l.text.split(/[ ，,]+/).filter(Boolean);
const blockW = l => cols(l).length * COLW;
function drawLine(l, xr, t, fade) {
  let idx = 0;
  const n = l.text.replace(/[ ，,]/g, "").length, step = Math.min(0.11, (l.end - l.t) * 0.35 / n);
  cols(l).forEach((seg, c) => {
    const x = xr - c * COLW - COLW / 2; let y = 250 + c * 70 + SZ * 0.55;
    for (const ch of seg) {
      const t0 = l.t - 0.12 + idx * step;
      drawGlyph(ch, x, y, SZ, (t - t0) / 0.5, fade * (0.82 + 0.18 * hash(l.t * 10 + idx)));
      y += SZ * 1.08; idx++;
    }
  });
}
function lyrics(t) {
  const i = lastBefore(LINES.map(l => l.t - 0.2), t); if (i < 0) return;
  const cur = LINES[i]; if (t > cur.end + 0.9) return;
  const contiguous = (a, b) => a && b && b.t - a.end < 1.0 && sectionIndex(a.t) === sectionIndex(b.t);
  const prev = contiguous(LINES[i - 1], cur) ? LINES[i - 1] : null;
  const pp = prev && contiguous(LINES[i - 2], prev) ? LINES[i - 2] : null;
  const k = ease((t - (cur.t - 0.2)) / 0.6);
  const fadeOut = contiguous(cur, LINES[i + 1]) ? 1 : 1 - ease((t - (cur.end + 0.1)) / 0.8);
  if (prev) {
    const D = pp ? blockW(pp) + GAP : 0;
    if (pp) drawLine(pp, XR + D * k, t, 0.5 * (1 - k) * fadeOut);
    drawLine(prev, XR - D * (1 - k), t, lerp(1, 0.5, k) * fadeOut);
    drawLine(cur, XR - blockW(prev) - GAP, t, fadeOut);
  } else drawLine(cur, XR, t, fadeOut);
}
function titleCard(t, t0, a) {                         // 片头片尾：竖排歌名 + Gao
  if (a <= 0) return;
  [..."人生幸事"].forEach((ch, j) => drawGlyph(ch, 600, 420 + j * 150, 136, (t - (t0 + j * 0.4)) / 0.7, a));
  [..."Gao"].forEach((ch, j) => drawGlyph(ch, 560 + j * 40, 1060, 50, (t - (t0 + 1.8 + j * 0.1)) / 0.6, a * 0.8));
}

// ---------- 主渲染 ----------
function renderAt(t) {
  g = ctx;
  scenery(t);
  const first = LINES[0].t;
  titleCard(t, 1.2, ease(t / 0.8) * (1 - ease((t - (first - 1.4)) / 1.0)));
  if (t > 186) titleCard(t, 186.2, ease((t - 186) / 1.5) * (1 - ease((t - (TL.duration - 2.2)) / 2)));
  if (t > first - 1.4 && t < 186.5) lyrics(t);
}
window.renderAt = renderAt;

// ---------- 预览控制 ----------
const audio = document.getElementById("audio"), seek = document.getElementById("seek"), play = document.getElementById("play");
const sceneSel = document.getElementById("scene"), timeEl = document.getElementById("time");
TL.sections.forEach(s => { const o = document.createElement("option"); o.value = s.t; o.textContent = s.name; sceneSel.appendChild(o); });
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const params = new URLSearchParams(location.search);
if (params.has("export")) document.body.classList.add("export");
let manualT = parseFloat(params.get("t") || "0");
function frame() {
  const t = audio.paused ? manualT : audio.currentTime;
  renderAt(t);
  timeEl.textContent = fmt(t);
  if (!audio.paused) seek.value = Math.round(1000 * t / TL.duration);
  const sv = String(TL.sections[sectionIndex(t)].t); if (sceneSel.value !== sv) sceneSel.value = sv;
  requestAnimationFrame(frame);
}
play.onclick = () => { if (audio.paused) { audio.currentTime = manualT; audio.play(); play.textContent = "暂停"; } else { audio.pause(); manualT = audio.currentTime; play.textContent = "播放"; } };
seek.oninput = () => { manualT = TL.duration * seek.value / 1000; audio.currentTime = manualT; };
sceneSel.onchange = () => { manualT = parseFloat(sceneSel.value); audio.currentTime = manualT; seek.value = Math.round(1000 * manualT / TL.duration); };
const ALL_TEXT = LINES.map(l => l.text).join("") + "人生幸事Gao";
window.READY = Promise.all([
  document.fonts.load(`80px MSZ`, ALL_TEXT).catch(() => []),
  document.fonts.load(`80px "Ma Shan Zheng"`, ALL_TEXT).catch(() => []),
]).then(() => document.fonts.ready).then(() => { if (!params.has("export")) frame(); else renderAt(manualT); });
</script>
